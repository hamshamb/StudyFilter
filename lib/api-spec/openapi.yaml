openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: StudyFilter API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: study
    description: Study and chat operations
  - name: progress
    description: Student progress operations
  - name: library
    description: Library resources (NCERT books, exam papers, marking schemes)
  - name: planner
    description: Study and revision planner
  - name: pomodoro
    description: Pomodoro focus sessions
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /study/ask:
    post:
      operationId: askStudyFilter
      tags: [study]
      summary: Ask a CBSE question
      description: First checks local CBSE database, then falls back to Claude AI
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudyQuestion"
      responses:
        "200":
          description: Answer from local data or Claude AI
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudyAnswer"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /study/fetch-sources:
    post:
      operationId: fetchSources
      tags: [study]
      summary: Fetch content from approved educational sources
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SourceFetchRequest"
      responses:
        "200":
          description: Fetched source excerpts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SourceExcerpt"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /study/compare:
    post:
      operationId: compareAnswers
      tags: [study]
      summary: Compare and score three answers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompareRequest"
      responses:
        "200":
          description: Comparison result with scores and best answer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompareResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /study/ocr:
    post:
      operationId: extractTextFromImage
      tags: [study]
      summary: Extract text from an image using OCR
      description: Accepts a base64-encoded image and returns the extracted text using Claude vision
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OcrRequest"
      responses:
        "200":
          description: Extracted text from the image
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OcrResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: OCR unavailable (no API key)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /study/search-web:
    post:
      operationId: searchWebAndAnswer
      tags: [study]
      summary: Search educational websites and synthesize best answer with Claude
      description: Automatically queries approved educational sites, scrapes top results, and uses Claude to compare and synthesize the best CBSE-aligned answer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebSearchRequest"
      responses:
        "200":
          description: Synthesized answer with web sources
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudyAnswer"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Service unavailable (no API key)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /study/answer-variant:
    post:
      operationId: getAnswerVariant
      tags: [study]
      summary: Generate a Board-Exam-Mode formatted answer at a specific mark level
      description: Reuses the answer context cached from /study/ask to regenerate without re-scraping sources
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnswerVariantRequest"
      responses:
        "200":
          description: Board-exam formatted answer variant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnswerVariantResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Answer context expired — user must re-ask the question
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Service unavailable (no API key)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /study/practice-quiz:
    post:
      operationId: generatePracticeQuiz
      tags: [study]
      summary: Generate a CBSE practice quiz
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PracticeQuizRequest"
      responses:
        "200":
          description: Generated practice quiz questions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PracticeQuizResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Service unavailable (no API key)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /study/summary:
    post:
      operationId: getChapterSummary
      tags: [study]
      summary: Generate a CBSE chapter summary
      description: Returns a structured, exam-ready summary for a subject/chapter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChapterContentRequest"
      responses:
        "200":
          description: Structured chapter summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudyAnswer"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /study/ncert-answers:
    post:
      operationId: getNcertAnswers
      tags: [study]
      summary: Generate NCERT-style questions with model answers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChapterContentRequest"
      responses:
        "200":
          description: NCERT-style questions and model answers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NcertAnswersResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Service unavailable (no API key)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /study/important-questions:
    post:
      operationId: getImportantQuestions
      tags: [study]
      summary: Generate important board-exam questions for a chapter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChapterContentRequest"
      responses:
        "200":
          description: Important questions for the chapter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportantQuestionsResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Service unavailable (no API key)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /study/revision-notes:
    post:
      operationId: generateRevisionNotes
      tags: [study]
      summary: Generate easy-to-revise notes for a chapter
      description: Returns structured, revision-friendly notes for a subject/chapter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChapterContentRequest"
      responses:
        "200":
          description: Structured revision notes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevisionNotes"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Service unavailable (no API key)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /study/local-questions:
    get:
      operationId: getLocalQuestions
      tags: [study]
      summary: Get all sample CBSE questions
      parameters:
        - name: classLevel
          in: query
          schema:
            type: ["integer", "null"]
        - name: subject
          in: query
          schema:
            type: ["string", "null"]
        - name: chapter
          in: query
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: List of local CBSE questions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LocalQuestion"

  /progress:
    get:
      operationId: getProgress
      tags: [progress]
      summary: Get student progress stats
      parameters:
        - name: sessionId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Student progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentProgress"

    put:
      operationId: updateProgress
      tags: [progress]
      summary: Update student progress
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgressUpdate"
      responses:
        "200":
          description: Updated progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentProgress"

  /progress/activity:
    get:
      operationId: getRecentActivity
      tags: [progress]
      summary: Get recent activity for a session
      parameters:
        - name: sessionId
          in: query
          required: true
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Recent activity entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Activity"

    post:
      operationId: addActivity
      tags: [progress]
      summary: Add a recent activity entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivityInput"
      responses:
        "201":
          description: Activity recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Activity"

  /library/papers:
    get:
      operationId: listLibraryPapers
      tags: [library]
      summary: List exam papers
      description: Returns exam papers filtered by subject, year, and/or paperType
      parameters:
        - in: query
          name: subject
          schema:
            type: string
          description: Filter by subject name
        - in: query
          name: year
          schema:
            type: integer
          description: Filter by year
        - in: query
          name: paperType
          schema:
            type: string
            enum: [previous_year, sample_paper, marking_scheme, mock_exam]
          description: Filter by paper type
      responses:
        "200":
          description: List of exam papers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryPapersResponse"
        "500":
          description: Server error

  /library/papers/{paperId}:
    get:
      operationId: getLibraryPaper
      tags: [library]
      summary: Get a single exam paper with its marking scheme
      parameters:
        - in: path
          name: paperId
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Exam paper detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryPaperDetailResponse"
        "404":
          description: Not found

  /library/ncert-books:
    get:
      operationId: listNcertBooks
      tags: [library]
      summary: List NCERT books
      parameters:
        - in: query
          name: subject
          schema:
            type: string
        - in: query
          name: language
          schema:
            type: string
      responses:
        "200":
          description: List of NCERT books
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NcertBooksResponse"
        "500":
          description: Server error

  /api/mock/attempts:
    post:
      operationId: createMockAttempt
      tags: [mock]
      summary: Save a completed mock exam attempt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MockAttemptInput"
      responses:
        "201":
          description: Attempt saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MockAttemptResponse"
        "400":
          description: Bad request
        "500":
          description: Server error
    get:
      operationId: listMockAttempts
      tags: [mock]
      summary: List mock exam attempts for a session
      parameters:
        - in: query
          name: sessionId
          required: true
          schema:
            type: string
        - in: query
          name: subject
          schema:
            type: string
      responses:
        "200":
          description: List of attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MockAttemptsListResponse"
        "400":
          description: Bad request
        "500":
          description: Server error

  /planner/plans:
    get:
      operationId: listStudyPlans
      tags: [planner]
      summary: List study plans for a session
      parameters:
        - in: query
          name: sessionId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Plans
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudyPlansListResponse"
    post:
      operationId: createStudyPlan
      tags: [planner]
      summary: Create a study plan and generate its schedule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudyPlanInput"
      responses:
        "201":
          description: Plan created with generated tasks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudyPlanDetailResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /planner/plans/{planId}:
    put:
      operationId: updateStudyPlan
      tags: [planner]
      summary: Update plan settings or status
      parameters:
        - in: path
          name: planId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudyPlanUpdate"
      responses:
        "200":
          description: Updated plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudyPlanDetailResponse"

  /planner/plans/{planId}/delete:
    post:
      operationId: deleteStudyPlan
      tags: [planner]
      summary: Delete a plan and its tasks
      parameters:
        - in: path
          name: planId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionRef"
      responses:
        "204":
          description: Deleted

  /planner/plans/{planId}/reschedule:
    post:
      operationId: reschedulePlan
      tags: [planner]
      summary: Redistribute missed and pending tasks
      parameters:
        - in: path
          name: planId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RescheduleRequest"
      responses:
        "200":
          description: Rescheduled plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudyPlanDetailResponse"

  /planner/tasks:
    get:
      operationId: listPlannerTasks
      tags: [planner]
      summary: List tasks for a session in a date range
      parameters:
        - in: query
          name: sessionId
          required: true
          schema:
            type: string
        - in: query
          name: planId
          schema:
            type: integer
        - in: query
          name: fromDate
          schema:
            type: string
        - in: query
          name: toDate
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
      responses:
        "200":
          description: Tasks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlannerTasksListResponse"
    post:
      operationId: createPlannerTask
      tags: [planner]
      summary: Create a custom task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlannerTaskInput"
      responses:
        "201":
          description: Task created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlannerTaskResponse"

  /planner/tasks/{taskId}:
    put:
      operationId: updatePlannerTask
      tags: [planner]
      summary: Update a task (move, complete, skip, edit)
      parameters:
        - in: path
          name: taskId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlannerTaskUpdate"
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlannerTaskResponse"

  /planner/tasks/{taskId}/delete:
    post:
      operationId: deletePlannerTask
      tags: [planner]
      summary: Delete a task
      parameters:
        - in: path
          name: taskId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionRef"
      responses:
        "204":
          description: Deleted

  /pomodoro/settings:
    get:
      operationId: getPomodoroSettings
      tags: [pomodoro]
      summary: Get pomodoro settings for a session
      parameters:
        - in: query
          name: sessionId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PomodoroSettings"
    put:
      operationId: updatePomodoroSettings
      tags: [pomodoro]
      summary: Update pomodoro settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PomodoroSettingsInput"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PomodoroSettings"

  /pomodoro/sessions:
    post:
      operationId: createFocusSession
      tags: [pomodoro]
      summary: Start a focus session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FocusSessionInput"
      responses:
        "201":
          description: Session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FocusSessionResponse"

  /pomodoro/sessions/{focusSessionId}:
    put:
      operationId: updateFocusSession
      tags: [pomodoro]
      summary: Update or finish a focus session
      parameters:
        - in: path
          name: focusSessionId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FocusSessionUpdate"
      responses:
        "200":
          description: Updated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FocusSessionResponse"

  /pomodoro/statistics:
    get:
      operationId: getPomodoroStatistics
      tags: [pomodoro]
      summary: Focus statistics for a session
      parameters:
        - in: query
          name: sessionId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PomodoroStatistics"


components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ApiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    OcrRequest:
      type: object
      required: [imageBase64, mediaType]
      properties:
        imageBase64:
          type: string
          description: Base64-encoded image data
        mediaType:
          type: string
          description: "MIME type: image/jpeg, image/png, image/gif, image/webp"

    OcrResult:
      type: object
      required: [extractedText, confidence]
      properties:
        extractedText:
          type: string
          description: Text extracted from the image
        confidence:
          type: string
          description: "high | medium | low"
        hint:
          type: ["string", "null"]
          description: Optional hint about the detected content type

    QuestionAnalysis:
      type: object
      required: [subject, questionType, recommendedMarks, availableMarkOptions, recommendationSource, cbsePatternVersion]
      properties:
        subject:
          type: string
          description: "Detected subject: mathematics | science | social_science | english | hindi_a | hindi_b | unknown"
        chapter:
          type: ["string", "null"]
        topic:
          type: ["string", "null"]
        questionType:
          type: string
          description: "objective | direct_answer | literature_extract | literature_short | literature_long | grammar | writing_skill | numerical | proof | diagram | descriptive | case_study | map_question | unknown"
        recommendedMarks:
          type: integer
          minimum: 1
          maximum: 6
          description: Recommended default mark selection per CBSE pattern
        availableMarkOptions:
          type: array
          items:
            type: integer
          description: Allowed mark values for this subject + question type
        recommendationSource:
          type: string
          description: "explicit_question | question_metadata | official_pattern | inferred"
        recommendationReason:
          type: ["string", "null"]
          description: Human-readable explanation for the recommended mark selection
        cbsePatternVersion:
          type: string
          description: CBSE exam pattern version used for classification

    AnswerVariantRequest:
      type: object
      required: [answerId, marks]
      properties:
        answerId:
          type: string
          description: The answerId returned from /study/ask (15-minute TTL)
        marks:
          type: integer
          minimum: 1
          maximum: 6
          description: Target mark value for the formatted answer
        contentLevel:
          type: string
          description: "simple | moderate | intermediate | advanced — controls language depth, not word count"

    AnswerVariantResponse:
      type: object
      required: [examReadyAnswer, format, resolvedMarks, targetWordRange, actualWordCount, scoringKeywords, answerPoints, workingSteps]
      properties:
        examReadyAnswer:
          type: string
          description: Full formatted answer text (always populated)
        introduction:
          type: ["string", "null"]
          description: Introduction paragraph (IBC format only)
        body:
          type: ["string", "null"]
          description: Body paragraph (IBC format only)
        conclusion:
          type: ["string", "null"]
          description: Conclusion paragraph (IBC format only)
        answerPoints:
          type: array
          items:
            type: string
          description: Numbered answer points (numbered_points format)
        workingSteps:
          type: array
          items:
            type: string
          description: Step-by-step working (worked_solution format)
        finalAnswer:
          type: ["string", "null"]
          description: Boxed final answer (worked_solution format)
        scoringKeywords:
          type: array
          items:
            type: string
          description: Key terms the examiner awards marks for
        format:
          type: string
          description: "direct | paragraph | intro_body_conclusion | numbered_points | worked_solution | case_study | writing_format"
        resolvedMarks:
          type: integer
          description: Actual mark value used (clamped 1-6)
        targetWordRange:
          type: object
          required: [min, max]
          properties:
            min:
              type: integer
            max:
              type: integer
        actualWordCount:
          type: integer
          description: Actual word count of the generated answer content

    StudyQuestion:
      type: object
      required: [question, classLevel]
      properties:
        question:
          type: string
        classLevel:
          type: integer
        subject:
          type: string
        chapter:
          type: string
        sessionId:
          type: string
