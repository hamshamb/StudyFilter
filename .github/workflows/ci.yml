name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Build API
        run: pnpm --filter @workspace/api-server build
      - name: Build frontend
        env:
          PORT: 5000
          BASE_PATH: /
          VITE_CLERK_PUBLISHABLE_KEY: pk_test_ZHVtbXkk
        run: pnpm --filter @workspace/study-filter build
